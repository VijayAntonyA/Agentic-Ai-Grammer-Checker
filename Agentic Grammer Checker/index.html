<!DOCTYPE html>
<html>

<head>
    <title>Grammar AI Agent</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fa;
            margin: 0;
        }

        .container {
            width: 60%;
            margin: 60px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #e6e6e6;
            transition: 0.3s;
        
        }

        .box:hover {
            transform: translateY(-3px);
            box-shadow: 0px 15px 35px rgba(0,0,0,0.2);
        }
        .actions {
    display: flex;
    flex-direction: column;   /* stack vertically */
    align-items: center;      /* center horizontally */
    gap: 12px;
    margin-top: 15px;
}

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 15px;
            outline: none;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 22px;
            border: none;
            background: #4a90e2;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        button:hover {
            background: #357bd8;
            transform: scale(1.05);
        }

        .result {
            margin-top: 25px;
        }

        .section {
            margin-top: 15px;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
        }

        .score {
            font-size: 20px;
            font-weight: bold;
        }

        .good { color: green; }
        .mid { color: orange; }
        .bad { color: red; }

        .issue {
            margin-top: 8px;
            padding: 8px;
            border-left: 4px solid #ff4d4d;
            background: #fff5f5;
        }
        .file-upload {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: #f0f4ff;
    color: #4a90e2;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    border: 1px solid #d6e4ff;
    transition: 0.3s;
}

    .file-upload:hover {
        background: #e6f0ff;
    }

    /* hide real input */
    .file-upload input {
        display: none;
    }
    .check-btn {
        padding: 14px 40px;
        font-size: 18px;
        font-weight: bold;
        background: #4a90e2;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .check-btn:hover {
        background: #357bd8;
        transform: scale(1.05);
    }
    .spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #ddd;
    border-top: 4px solid #4a90e2;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto;
}
    .error {
    text-decoration: underline;
    text-decoration-color: red;
    text-decoration-thickness: 2px;
    cursor: pointer;
}
    .editable-box {
        width: 100%;
        min-height: 120px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 15px;
        outline: none;
        white-space: pre-wrap;
    }

@keyframes spin {
    100% { transform: rotate(360deg); }
}
    </style>
</head>

<body>

<div class="container">
    <h1>Grammar & Consistency Checker</h1>

    <div class="box">
<div id="inputText" contenteditable="true" class="editable-box"
     placeholder="Type or paste your text here..."></div>
       <div class="actions">
    <label class="file-upload">
        📄 Upload File
        <input type="file" id="fileInput">
    </label>

<button class="check-btn" onclick="checkText()">Check</button></div>
<div id="loader" style="display:none; margin-top:15px;">
    <div class="spinner"></div>
    <p>Checking...</p>
</div>

<p id="fileName" style="font-size:14px; color:#666; margin-top:5px;"></p>
        <div class="result" id="result" style="display:none;"></div>
    </div>
</div>

<script>
async function checkText() {
    const file = document.getElementById("fileInput").files[0];
    let text = document.getElementById("inputText").innerText;    document.getElementById("loader").style.display = "block";
    
    if (file) {
        text = await file.text();
    }

    if (!text) {
        alert("Enter text or upload file");
        return;
    }

    try {
        const response = await fetch("http://127.0.0.1:8000/check", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();
        let highlighted = data.original;

        data.grammar_issues.forEach(issue => {
        if (issue.error_text) {

        const safeWord = issue.error_text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        // match even small words like "u", "r"
        const regex = new RegExp(`\\b${safeWord}\\b`, "gi");

        highlighted = highlighted.replace(regex, (match) => {

            return `<span class="error" 
            data-suggestion="${issue.suggestion}" 
            title="${issue.message} → ${issue.suggestion}">
            ${match}
        </span>`;
        });
    }
});

        let scoreClass = "good";
        if (data.score < 80) scoreClass = "mid";
        if (data.score < 50) scoreClass = "bad";

        document.getElementById("result").style.display = "block";

        document.getElementById("result").innerHTML = `       
                 

        <div class="section">
            <b>Score: ${data.score}/100</b>
        </div>

        <div class="section">
            <b>Text with Highlights:</b>
            <p style="white-space: pre-line;">${highlighted}</p>
        </div>

        <div class="section">
            <b>Corrected Text:</b>
            <p style="white-space: pre-line;">${data.corrected}</p>
        </div>

        <div class="section">
            <b>Grammar Issues:</b>
            ${data.grammar_issues.map(issue => `
                <div class="issue">
                    ❌ <b>${issue.error_text}</b><br>
                    💡 ${issue.message}<br>
                    ✔ ${issue.suggestion}
                </div>
            `).join("")}
        </div>

        <div class="section">
            <b>Consistency Issues:</b>
            <p>${data.consistency_issues.join("<br>") || "None"}</p>
        </div>
        `;  
    } catch (error) {
        console.error(error);
        alert("Error occurred");
    }
    document.getElementById("loader").style.display = "none";

}
document.getElementById("fileInput").addEventListener("change", function() {
    const file = this.files[0];
    document.getElementById("fileName").innerText = file ? "Selected: " + file.name : "";
});
</script>

</body>
</html>
